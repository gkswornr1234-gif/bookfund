name: 북펀딩 수집

on:
  schedule:
        - cron: "30 22 * * *"   # 매일 07:30 (KST). 예약 실행이 밀릴 수 있어 외부 트리거와 병행 권장
  workflow_dispatch:
    inputs:
      debug:
        description: "받은 HTML을 아티팩트로 저장 (셀렉터 점검용)"
        type: boolean
        default: false
      only:
        description: "한 서점만 실행 (aladin / yes24 / kyobo, 비우면 전체)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 수집
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEBUG_DIR: ${{ inputs.debug && 'debug' || '' }}
          ONLY: ${{ inputs.only }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "$ONLY" ]; then python run.py --only "$ONLY"; else python run.py; fi

      - name: HTML 저장 (디버그)
        if: ${{ always() && inputs.debug }}
        uses: actions/upload-artifact@v5
        with:
          name: debug-html
          path: debug/
          retention-days: 7

      - name: 데이터 커밋
        if: always()   # 수집이 중간에 실패해도 그때까지 모은 데이터는 저장
        run: |
          git config user.name "bookfund-bot"
          git config user.email "bookfund-bot@users.noreply.github.com"
          git add docs/data/fundings.json
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash
          git push
