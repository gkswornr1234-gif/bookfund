name: 북펀딩 수집

on:
  # 매일 07:30 실행은 cron-job.org가 이 워크플로를 호출하는 방식 (GitHub 자체 예약은 지연·누락이 잦아 사용 안 함)
  workflow_dispatch:
    inputs:
      debug:
        description: "받은 HTML을 아티팩트로 저장 (셀렉터 점검용)"
        type: boolean
        default: false
      test_alert:
        description: "수집 없이 팀즈 알림만 시험 발송 (알림 분야의 최근 3건)"
        type: boolean
        default: false
      backfill:
        description: "올해 종료된 펀딩까지 채우기 (알라딘·교보, 오래 걸림)"
        type: boolean
        default: false
      only:
        description: "한 서점만 실행 (aladin / yes24 / kyobo, 비우면 전체)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 수집
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          # 분야별로 다른 채널을 쓰면 여기에 한 줄씩 추가 (예: TEAMS_WEBHOOK_KIDS: ${{ secrets.TEAMS_WEBHOOK_KIDS }})
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEBUG_DIR: ${{ inputs.debug && 'debug' || '' }}
          ONLY: ${{ inputs.only }}
          BACKFILL: ${{ inputs.backfill && '--backfill' || '' }}
          TEST_ALERT: ${{ inputs.test_alert && '--test-alert' || '' }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "$TEST_ALERT" ]; then python run.py --test-alert
          elif [ -n "$ONLY" ]; then python run.py --only "$ONLY" $BACKFILL; else python run.py $BACKFILL; fi

      - name: HTML 저장 (디버그)
        if: ${{ always() && inputs.debug }}
        uses: actions/upload-artifact@v5
        with:
          name: debug-html
          path: debug/
          retention-days: 7

      - name: 데이터 커밋
        if: always()   # 수집이 중간에 실패해도 그때까지 모은 데이터는 저장
        run: |
          git config user.name "bookfund-bot"
          git config user.email "bookfund-bot@users.noreply.github.com"
          git add docs/data/fundings.json
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash
          git push
